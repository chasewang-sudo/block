<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方块打地鼠：进阶版</title>
    <style>
        :root {
            --bg-0: #d9f6b9;
            --bg-1: #c9eca0;
            --bg-2: #bde28f;
            --panel: #ffffffd9;
            --panel-border: rgba(95, 68, 29, 0.15);
            --grid: #f7e4c0;
            --grid-border: rgba(120, 90, 45, 0.18);
            --block-a: #7fd45f;
            --block-b: #6bc24f;
            --block-glow: rgba(107, 194, 79, 0.45);
            --text: #2f2a18;
            --muted: #6e5b2b;
            --accent: #ffb347;
            --danger: #ff5a6c;
            --shadow: 0 18px 45px rgba(44, 30, 12, 0.22);
            --radius: 16px;
            --device-w: 402px;
            --device-h: 874px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Baloo 2", "Comic Sans MS", "PingFang SC", "Noto Sans SC", sans-serif;
            background:
                        radial-gradient(900px 600px at 80% -10%, #f6ffe9 0%, transparent 60%),
                        radial-gradient(800px 800px at -10% 10%, #c7efb0 0%, transparent 55%),
                        linear-gradient(160deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
            color: var(--text);
            margin: 0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.35) 1px, transparent 1px);
            background-size: 22px 22px;
            opacity: 0.22;
            pointer-events: none;
            mix-blend-mode: soft-light;
        }

        .device-shell {
            width: min(var(--device-w), 94vw);
            height: min(var(--device-h), 94vh);
            background: url('grassbackground.jpg') center / 100% 100% no-repeat;
            border-radius: 34px;
            border: 4px solid rgba(110, 76, 28, 0.2);
            box-shadow: 0 24px 60px rgba(52, 34, 12, 0.35);
            padding: 16px 14px 20px;
            position: relative;
            overflow: hidden;
        }

        .device-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .preload {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .app {
            position: relative;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 10px 12px;
        }

        header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 4px 0;
            box-sizing: border-box;
        }

        .top-time {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: #2b2919;
        }

        .top-settings {
            font-size: 22px;
            color: #6b5a2c;
        }

        .goal-panel {
            width: 100%;
            background: transparent;
            border-radius: 10px;
            padding: 4px 6px 6px;
            margin-top: 2px;
        }

        .goal-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .goal-card {
            background: rgba(255, 255, 255, 0.42);
            border: 1px solid rgba(120, 80, 30, 0.22);
            border-radius: 8px;
            padding: 6px 8px;
            text-align: center;
        }

        .goal-card-label {
            color: #11853a;
            font-size: 0.78rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .goal-card-value {
            color: #11853a;
            font-size: 1rem;
            font-weight: 900;
            line-height: 1.1;
        }

        /* 游戏主容器 */
        #board-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1;
            background: linear-gradient(180deg, #dfc18d, #cda667);
            padding: 5px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 2px solid rgba(120, 80, 30, 0.2);
        }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            width: 100%;
            height: 100%;
        }

        /* 地鼠独立层 */
        #mole-layer {
            position: absolute;
            top: 6px; left: 6px;
            width: calc(100% - 12px);
            height: calc(100% - 12px);
            pointer-events: none;
        }

        .cell {
            background: #f6e9cd;
            border-radius: 8px;
            border: 2px dashed rgba(132, 96, 52, 0.55);
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .cell.filled {
            background:
                linear-gradient(90deg, #6cc24a 50%, #63b142 50%),
                linear-gradient(0deg, #7bd157 50%, #6cc24a 50%);
            background-size: 6px 6px, 6px 6px;
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.25) inset,
                0 6px 12px rgba(40, 90, 30, 0.35);
            transform: translateY(-1px);
        }

        .cell.has-hole {
            background-color: transparent;
        }

        .cell.has-hole::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--hole-img, url('hole1.png')) center / cover no-repeat;
            z-index: 1;
        }

        .cell.reachable {
            outline: 2px solid rgba(142, 216, 110, 0.7);
            outline-offset: -2px;
            background: rgba(170, 230, 140, 0.3);
        }

        .cell.preview {
            background: rgba(120, 200, 90, 0.35);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.45) inset;
        }

        .cell.preview.invalid {
            background: rgba(255, 90, 108, 0.28);
            box-shadow: 0 0 0 2px rgba(255,90,108,0.45) inset;
        }

        .cell.preview.hit {
            outline: 2px solid rgba(255, 214, 74, 0.85);
            outline-offset: -2px;
        }

        .cell.line-preview {
            background: rgba(255, 214, 74, 0.25);
        }

        .board-shake {
            animation: board-shake 0.22s ease;
        }

        @keyframes board-shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-3px); }
            100% { transform: translateX(0); }
        }

        .screen-shake {
            animation: screen-shake 0.25s ease;
        }

        @keyframes screen-shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-3px, 2px); }
            50% { transform: translate(3px, -2px); }
            75% { transform: translate(-2px, -2px); }
            100% { transform: translate(0, 0); }
        }

        .cell.pulse {
            animation: cell-pulse 0.4s ease;
        }

        @keyframes cell-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(110,243,194,0.0); }
            50% { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(110,243,194,0.15); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(110,243,194,0.0); }
        }

        /* 地鼠动画逻辑 */
        .mole-entity {
            position: absolute;
            width: 12.5%;
            height: 12.5%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: translate3d(var(--mx, 0), var(--my, 0), 0);
            will-change: transform;
            pointer-events: none;
        }

        .mole-entity .mole-sprite {
            width: calc(88% + 20px);
            height: calc(88% + 20px);
            object-fit: contain;
            filter: drop-shadow(0 6px 8px rgba(120,70,20,0.35));
            animation: mole-bob 1.6s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
        }

        @keyframes mole-bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .hammer {
            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 200;
            background: url('hammer.png') center / contain no-repeat;
        }

        #pieces-container {
            margin-top: 64px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
            height: 110px;
            padding: 8px 2px 6px;
            border-radius: 14px;
        }

        .piece-slot {
            flex: 1;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 224, 140, 0.65);
            border: 1px solid rgba(120, 80, 30, 0.18);
            border-radius: 14px;
            box-shadow: 0 8px 18px rgba(120, 80, 30, 0.18);
        }

        .piece {
            display: grid;
            gap: 4px;
            cursor: grab;
            transition: transform 0.2s, filter 0.2s;
            filter: drop-shadow(0 6px 8px rgba(120,70,20,0.25));
            touch-action: none;
            padding: 10px;
        }

        .drag-ghost {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            display: grid;
            gap: 4px;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25));
        }

        .piece:active { cursor: grabbing; transform: scale(1.02); }

        .p-cell {
            width: 22px;
            height: 22px;
            background:
                linear-gradient(90deg, #74cd55 50%, #66bb4a 50%),
                linear-gradient(0deg, #83da5f 50%, #74cd55 50%);
            background-size: 6px 6px, 6px 6px;
            border-radius: 5px;
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.18) inset,
                0 4px 8px rgba(40, 90, 30, 0.25);
            position: relative;
        }

        .p-cell.empty { background: transparent; box-shadow: none; }

        .p-cell.has-range::before {
            content: '';
            position: absolute;
            width: 70%;
            height: 40%;
            left: 15%;
            bottom: 6%;
            background: radial-gradient(ellipse at center, #5a3a16 0%, #3f2710 60%, #2a1908 100%);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 2px 2px rgba(0,0,0,0.45) inset;
        }

        .p-cell.has-mole::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 50%;
            top: 4%;
            transform: translateX(-50%);
            background: url('mole.png') center / contain no-repeat;
        }


        .cell.clearing {
            animation: clear-pop 0.35s ease both;
            background: radial-gradient(circle, #fff 0%, #ffe2a4 40%, #ffc46b 100%);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.6) inset, 0 8px 18px rgba(120,70,20,0.35);
        }

        @keyframes clear-pop {
            0% { transform: scale(1); opacity: 1; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.2; }
        }

        .cell.crack {
            animation: crack-jitter 0.18s ease;
            background: linear-gradient(135deg, #ead1a2, #c9a160);
        }

        @keyframes crack-jitter {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            50% { transform: translateX(2px); }
            75% { transform: translateX(-1px); }
            100% { transform: translateX(0); }
        }

        .cell.shatter {
            animation: shatter 0.32s ease both;
            background: radial-gradient(circle, #fff 0%, #f0d29c 45%, #cfa15a 100%);
        }

        @keyframes shatter {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            70% { transform: scale(1.1) rotate(4deg); opacity: 0.9; }
            100% { transform: scale(0.85) rotate(-6deg); opacity: 0.1; }
        }

        .hammer.ready {
            animation: hammer-ready 0.22s ease-out forwards;
        }

        .hammer.hit {
            animation: hammer-hit-strong 0.38s ease-out forwards;
        }

        .hammer.smash {
            animation: hammer-smash 0.35s ease-out forwards;
            transform-origin: center center;
        }

        @keyframes hammer-smash {
            0% { transform: scale(1.25) translate(0, -30px) rotate(-12deg); opacity: 0; }
            40% { transform: scale(0.95) translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: scale(0.8) translate(0, 10px) rotate(6deg); opacity: 0; }
        }

        .mole-entity.stunned .mole-sprite {
            animation: mole-stun 0.5s ease-out forwards;
        }

        .mole-entity.scared .mole-sprite {
            animation: mole-scared 0.6s ease-in-out infinite;
        }

        @keyframes mole-scared {
            0% { transform: translateX(-2px); }
            50% { transform: translateX(2px); }
            100% { transform: translateX(-2px); }
        }

        .mole-entity .mole-emoji {
            position: absolute;
            top: -4px;
            right: -2px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .mole-entity.scared .mole-emoji {
            opacity: 1;
        }

        @keyframes mole-stun {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(6px) rotate(-12deg); opacity: 0.6; }
        }

        .egg {
            position: absolute;
            font-size: 22px;
            z-index: 210;
            animation: egg-pop 0.35s ease-out forwards;
        }

        .egg.shatter {
            animation: egg-shatter 0.45s ease-out forwards;
        }

        @keyframes egg-shatter {
            0% { transform: scale(1); opacity: 1; }
            60% { transform: scale(1.2); opacity: 0.9; }
            100% { transform: scale(0.6); opacity: 0; }
        }

        .reward-fly {
            position: absolute;
            font-size: 18px;
            z-index: 220;
            animation: reward-fly 0.7s ease-out forwards;
        }

        @keyframes reward-fly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-28px) scale(1.1); opacity: 0; }
        }

        .reward-fly.to-top {
            animation: reward-to-top 0.9s ease-out forwards;
        }

        @keyframes reward-to-top {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(-120px, -260px) scale(0.9); opacity: 0; }
        }

        .money-flyer {
            position: fixed;
            z-index: 3000;
            pointer-events: none;
            font-size: 20px;
            font-weight: 900;
            color: #11853a;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(17, 133, 58, 0.4);
            border-radius: 999px;
            padding: 4px 8px;
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            transition:
                left 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
                top 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
                transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
                opacity 0.9s ease-out;
        }
        @keyframes hammer-ready {
            0% { transform: translate(0, -60px) rotate(-35deg); opacity: 0; }
            100% { transform: translate(0, -10px) rotate(-10deg); opacity: 1; }
        }

        @keyframes hammer-hit-strong {
            0% { transform: translate(0, -10px) rotate(-10deg); opacity: 1; }
            35% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(0, -20px) rotate(8deg); opacity: 0; }
        }

        .mole-entity.money .mole-sprite {
            animation: money-fly 0.6s ease-out forwards;
        }

        @keyframes money-fly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            60% { transform: translateY(-18px) scale(1.1); opacity: 1; }
            100% { transform: translateY(-30px) scale(0.9); opacity: 0; }
        }

        @keyframes egg-pop {
            0% { transform: translateY(-4px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .toast {
            position: absolute;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(120, 80, 30, 0.2);
            border-radius: 14px;
            padding: 6px 12px;
            font-weight: 800;
            color: #000;
            box-shadow: 0 8px 18px rgba(120, 80, 30, 0.2);
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(2px);
        }

        #level-gate {
            position: absolute;
            inset: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(16, 16, 16, 0.58);
            backdrop-filter: blur(2px);
        }

        .level-card {
            width: min(92%, 360px);
            background: linear-gradient(180deg, rgba(241, 241, 241, 0.97), rgba(219, 219, 219, 0.96));
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 26px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            padding: 14px 14px 14px;
            color: #202020;
        }

        .level-title {
            text-align: center;
            font-size: 1.62rem;
            font-weight: 900;
            letter-spacing: 0.02em;
            margin: 2px 0 8px;
        }

        .level-rules {
            margin: 0 0 8px;
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            line-height: 1.35;
            font-weight: 700;
        }

        .level-info {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 18px;
            padding: 10px 10px 12px;
            text-align: center;
        }

        .level-info-row {
            margin: 0;
        }

        .level-info-label {
            font-size: 1rem;
            font-weight: 900;
        }

        .level-info-goal {
            margin-top: 2px;
            font-size: 1.24rem;
            font-weight: 900;
            letter-spacing: 0.01em;
        }

        .level-info-max {
            margin-top: 2px;
            font-size: 2rem;
            font-weight: 900;
            line-height: 1;
            color: #0c8e44;
        }

        .gate-atmosphere {
            margin: 8px 0;
            height: 86px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.13);
            background:
                radial-gradient(90px 50px at 20% 70%, rgba(94, 73, 47, 0.35), transparent 70%),
                radial-gradient(110px 64px at 82% 30%, rgba(72, 113, 43, 0.35), transparent 72%),
                linear-gradient(180deg, rgba(151, 196, 100, 0.72), rgba(112, 153, 69, 0.64));
            position: relative;
            overflow: hidden;
        }

        .gate-atmosphere::before {
            content: '🕳️   🐹   🕳️   🐹';
            position: absolute;
            bottom: 8px;
            left: 10px;
            font-size: 24px;
            letter-spacing: 8px;
            opacity: 0.78;
        }

        .stake-scroll {
            margin-top: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .stake-scroll::-webkit-scrollbar {
            display: none;
        }

        .stake-picker {
            display: flex;
            gap: 10px;
            min-width: max-content;
            padding-bottom: 2px;
        }

        .stake-btn {
            min-width: 90px;
            border: 1px solid rgba(0, 0, 0, 0.18);
            background: linear-gradient(180deg, #ffffff, #dcdcdc);
            color: #1f1f1f;
            border-radius: 14px;
            height: 50px;
            font-size: 1.02rem;
            font-weight: 900;
            padding: 0;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .stake-btn.active {
            background: linear-gradient(180deg, #fff4d4, #ffd98a);
            border-color: rgba(128, 92, 24, 0.45);
            color: #3d2b08;
            transform: translateY(-1px);
        }

        .debug-entry {
            margin-top: 10px;
            border-radius: 14px;
            border: 1px dashed rgba(30, 30, 30, 0.35);
            background: rgba(20, 20, 20, 0.16);
            padding: 8px 10px 10px;
        }

        .debug-title {
            font-size: 0.82rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            opacity: 0.85;
            margin-bottom: 6px;
        }

        .debug-multi-picker {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .debug-multi-btn {
            border: 1px solid rgba(12, 120, 96, 0.38);
            background: rgba(40, 100, 90, 0.22);
            color: #0b3430;
            border-radius: 10px;
            height: 38px;
            font-size: 0.94rem;
            font-weight: 900;
            padding: 0;
        }

        .debug-multi-btn.active {
            background: rgba(28, 152, 123, 0.36);
            border-color: rgba(13, 95, 75, 0.6);
            color: #082f29;
        }

        .debug-hint {
            margin-top: 6px;
            font-size: 0.76rem;
            opacity: 0.76;
        }

        .debug-mode-toggle {
            margin-top: 8px;
            width: 100%;
            height: 38px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.32);
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 800;
            padding: 0;
        }

        .debug-mode-toggle.active {
            background: rgba(85, 186, 255, 0.3);
            border-color: rgba(120, 216, 255, 0.8);
        }

        .debug-toggle-btn {
            position: absolute;
            left: 50%;
            bottom: 8px;
            transform: translateX(-50%);
            z-index: 910;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(20, 20, 20, 0.35);
            color: #fff;
            border-radius: 999px;
            height: 34px;
            min-width: 86px;
            padding: 0 14px;
            font-size: 0.82rem;
            font-weight: 800;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        }

        .debug-drawer {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 48px;
            z-index: 909;

    const BLOCK_SEQUENCE_IDS = ["1111001","1111001","1224015","1313007","1223014","1223013","1224015","1224015","1313007","1313007","1122003","1122003","1236063","1224015","1313007","1234060","1122003","1212003","1224015","1313007","1111001","1212003","1234023","1234058","1234060","1223007","1224015","1212003","1234058","1324043","1223007","1133007","1234023","1223014","1122003","1223011","1133007","1222006","1223013","1212003","1133007","1234058","1313007","1133007","1313007","1133007","1234058","1111001","1326063","1222009","1223007","1212003","1313007","1234023","1223013","1212003","1222009","1335295","1223007","1222009","1212003","1313007","1313007","1111001","1222009","1111001","1223014","1223007","1133007","1234023","1122003","1224015","1324029","1133007","1111001","1224015","1222006","1223011","1122003","1122003","1234058","1111001","1324046","1324046","1223013","1223014","1111001","1223007","1133007","1133007","1212003","1223013","1324029","1223011","1324029","1224015","1212003","1223014","1222009","1324046","1324046","1234058","1223007","1223013","1223013","1223011","1122003","1122003","1212003","1223013","1223011","1326063","1234023","1111001","1111001","1234023","1224015","1212003","1223007","1122003"];

    const SHAPES = BLOCK_FIGURES.map((f) => ({ id: f.id, s: f.s, w: f.w, h: f.h }));
    const SHAPE_BY_ID = new Map(SHAPES.map((shape) => [shape.id, shape]));
    const MOLE_WHITELIST = new Set([
        '1224015', // 2x2
        '1133007', // 3x1
        '1313007', // 1x3
        '1223007', '1223013', '1223014', '1223011', // 2x2 L
        '1234058', '1234023', '1324046', '1324029', // T
        '1234060', '1234039', '1234015', '1234057', '1324043', '1324023', '1324053', '1324058' // L
    ]);
    const MOLE_BLACKLIST = new Set([
        '1333273', '1333084', '1335079', '1335457', '1335484', '1335295', '1339511', // 3x3
        '1144015', '1414015', // 1x4/4x1
        '1222009', '1222006' // diagonal 2x2
    ]);

    const MAX_KILLS = 15;
    const HOLE_COLORS = ['#6b4b2a', '#4a7b3e', '#2f5f8a', '#8a5a2f', '#6b2f6b', '#2f6b6b'];

        2: 0.30,
        2.5: 0.40,
        3: 0.20

    const FORCE_SECOND_BLOCK = false;
    const FORCE_ONE_MOLE_IN_FIRST_THREE = true;
    const DEBUG_RETURN_OPTIONS = [
        { value: 2, chance: 0.40 },
        { value: 2.5, chance: 0.50 },
        { value: 3, chance: 0.10 }
    ];

    function initGrid() {
        gridEl.innerHTML = '';
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `grid-${r}-${c}`;
                gridEl.appendChild(cell);
            }
        }
    }

    function applyInitialGrid() {
        for (let r = 0; r < GRID_SIZE; r++) {
            const rowBits = LEVEL_INITIAL_GRID[r] || 0;
            for (let c = 0; c < GRID_SIZE; c++) {
                const bit = (rowBits >> (GRID_SIZE - 1 - c)) & 1;
                grid[r][c] = bit ? 1 : 0;
                holes[r][c] = 0;
                holeVisits[r][c] = 0;
                holeBlockId[r][c] = -1;
            }
        }
        updateGridView();
    }

    function nextSequenceShape() {
        const seqIndex = blockSequenceCursor;
        let nextId;
        if (debugUnlimitedMode) {
            const randomIdx = Math.floor(runRandom() * SHAPES.length);
            nextId = SHAPES[randomIdx].id;
        } else {
            nextId = BLOCK_SEQUENCE_IDS[blockSequenceCursor % BLOCK_SEQUENCE_IDS.length];
        }
        blockSequenceCursor++;
        return {
            seqIndex,
            shapeObj: SHAPE_BY_ID.get(nextId) || SHAPES[0]
        };
    }

    function deterministicRoll01(seqIndex) {
        const raw = Math.sin((seqIndex + 1) * 12.9898 + 78.233) * 43758.5453;
        return raw - Math.floor(raw);
    }

    function getCurrentMoleSpawnRate() {
        return MOLE_SPAWN_RATE_BY_MULTIPLIER[activeReturnMultiplier] ?? 0.30;
    }

    function mulberry32(seed) {
        let t = seed >>> 0;
        return function() {
            t += 0x6D2B79F5;
            let x = Math.imul(t ^ (t >>> 15), 1 | t);
            x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
            return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
        };
    }

    function startRandomRunSeed() {
        runSeed = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
        runRandom = mulberry32(runSeed);
    }

    function isMoleEligibleByList(shapeObj) {
        return MOLE_WHITELIST.has(shapeObj.id) && !MOLE_BLACKLIST.has(shapeObj.id);
    }

    function countActiveCells(shapeObj) {
        let count = 0;
        shapeObj.s.forEach((row) => row.forEach((v) => { if (v) count++; }));
        return count;
    }

    function generatePieces() {
        piecesContainer.innerHTML = '';

        const pieces = [];
        for (let i = 0; i < 3; i++) {
            const seqItem = nextSequenceShape();
            pieces.push({
                shapeObj: seqItem.shapeObj,
                forceMole: false,
                seqIndex: seqItem.seqIndex
            });
        }

        const eligibleIndexes = pieces
            .map((p, idx) => (isMoleEligibleByList(p.shapeObj) ? idx : -1))
            .filter(idx => idx !== -1);

        if (FORCE_SECOND_BLOCK && pieces[1] && isMoleEligibleByList(pieces[1].shapeObj)) {
            pieces[1].forceMole = true;
        }

        if (FORCE_ONE_MOLE_IN_FIRST_THREE) {
            const hasFirstThreeMole = pieces.some(p => p.seqIndex < 3 && p.forceMole);
            if (!hasFirstThreeMole) {
                const firstThreeIndexes = pieces
                    .map((p, idx) => (p.seqIndex < 3 ? idx : -1))
                    .filter(idx => idx !== -1);
                const firstThreeEligible = pieces
                    .map((p, idx) => (p.seqIndex < 3 && isMoleEligibleByList(p.shapeObj) ? idx : -1))
                    .filter(idx => idx !== -1);
                if (firstThreeEligible.length === firstThreeIndexes.length && firstThreeEligible.length > 0) {
                    const candidates = firstThreeEligible.map((idx) => ({
                        idx,
                        cells: countActiveCells(pieces[idx].shapeObj)
                    }));
                    candidates.sort((a, b) => b.cells - a.cells || a.idx - b.idx);
                    const pick = candidates[0].idx;
                    pieces[pick].forceMole = true;
                } else if (firstThreeEligible.length > 0) {
                    const pick = firstThreeEligible.includes(1) ? 1 : firstThreeEligible[0];
                    pieces[pick].forceMole = true;
                } else {
                    const firstThree = pieces
                        .map((p, idx) => ({ idx, p }))
                        .filter(({ p }) => p.seqIndex < 3);
                    if (firstThree.length > 0) {
                        firstThree.sort((a, b) => countActiveCells(a.p.shapeObj) - countActiveCells(b.p.shapeObj) || a.idx - b.idx);
                        const pick = firstThree[0].idx;
                        pieces[pick].forceMole = true;
                        pieces[pick].forceMoleOverrideList = true;
                    }
                }
            }
        }

        eligibleIndexes.forEach((idx) => {
            if (pieces[idx].forceMole) return;
            const roll = debugUnlimitedMode ? runRandom() : deterministicRoll01(pieces[idx].seqIndex);
            if (roll < getCurrentMoleSpawnRate()) {
                pieces[idx].forceMole = true;
            }
        });

        for (let i = 0; i < 3; i++) {
            const slot = document.createElement('div');
            slot.className = 'piece-slot';

            const shapeObj = pieces[i].shapeObj;
            const shapeH = shapeObj.s.length;
            const shapeW = shapeObj.s[0].length;
            const pieceEl = document.createElement('div');
            pieceEl.className = 'piece';
            pieceEl.draggable = false;

            let validCells = [];
            shapeObj.s.forEach((row, r) => row.forEach((v, c) => v && validCells.push({r, c})));

            const allowMole = pieces[i].forceMole === true
                && (isMoleEligibleByList(shapeObj) || pieces[i].forceMoleOverrideList === true);
            const fixedIdx = validCells.length
                ? (debugUnlimitedMode ? Math.floor(runRandom() * validCells.length) : (pieces[i].seqIndex % validCells.length))
                : 0;
            let molePos = allowMole ? validCells[fixedIdx] : null;
            const moleType = allowMole ? 'normal' : null;

            pieceEl.style.gridTemplateColumns = `repeat(${shapeW}, 1fr)`;
            pieceEl.setAttribute('data-shape', JSON.stringify(shapeObj.s));

            shapeObj.s.forEach((row, r) => {
                row.forEach((v, c) => {
                    const cEl = document.createElement('div');
                    cEl.className = v ? 'p-cell' : 'p-cell empty';
                    if (v && molePos) cEl.classList.add('has-range');
                    if (v && molePos && r === molePos.r && c === molePos.c) {
                        cEl.classList.add('has-mole');
                    }
                    pieceEl.appendChild(cEl);
                });
            });

            pieceEl.addEventListener('dragstart', (e) => {
                if(!gameActive) return;
                const shapeCopy = shapeObj.s.map(row => row.slice());
                const fixedMolePos = normalizeMolePos(shapeCopy, molePos);
                const data = {shape: shapeCopy, molePos: fixedMolePos, moleType};
                e.dataTransfer.setData('pieceData', JSON.stringify(data));
                pieceEl.style.opacity = '0.35';
                pieceEl.style.filter = 'grayscale(0.2) brightness(1.1)';

                const rect = pieceEl.getBoundingClientRect();
                const cellW = rect.width / shapeW;
                const cellH = rect.height / shapeH;
                const ox = (typeof e.offsetX === 'number') ? e.offsetX : rect.width / 2;
                const oy = (typeof e.offsetY === 'number') ? e.offsetY : rect.height / 2;
                const offsetC = Math.max(0, Math.min(shapeW - 1, Math.floor(ox / cellW)));
                const offsetR = Math.max(0, Math.min(shapeH - 1, Math.floor(oy / cellH)));
                dragInfo = { data, offsetR, offsetC, sourceEl: pieceEl };
                createDragGhost(shapeCopy, fixedMolePos);
            });
            pieceEl.addEventListener('dragend', () => {
                pieceEl.style.opacity = '1';
                pieceEl.style.filter = 'none';
                removeDragGhost();
                clearPreview();
                dragInfo = null;
            });
            pieceEl.addEventListener('mousedown', (e) => {
                if (!gameActive) return;
                e.preventDefault();
                const shapeCopy = shapeObj.s.map(row => row.slice());
                const fixedMolePos = normalizeMolePos(shapeCopy, molePos);
                const data = {shape: shapeCopy, molePos: fixedMolePos, moleType};
                const rect = pieceEl.getBoundingClientRect();
                const cellW = rect.width / shapeW;
                const cellH = rect.height / shapeH;
                const ox = e.clientX - rect.left;
                const oy = e.clientY - rect.top;
                const offsetC = Math.max(0, Math.min(shapeW - 1, Math.floor(ox / cellW)));
                const offsetR = Math.max(0, Math.min(shapeH - 1, Math.floor(oy / cellH)));
                touchDrag = { data, offsetR, offsetC, sourceEl: pieceEl, lift: 0 };
                pieceEl.style.opacity = '0.35';
                pieceEl.style.filter = 'grayscale(0.2) brightness(1.1)';
                createDragGhost(shapeCopy, fixedMolePos);
                moveDragGhost(e.clientX, e.clientY);
                updatePreviewFromPointer(e.clientX, e.clientY);
                const onMove = (ev) => {
                    updatePreviewFromPointer(ev.clientX, ev.clientY);
                    moveDragGhost(ev.clientX, ev.clientY);
                };
                const onUp = (ev) => {
                    finalizeTouchDrop(ev.clientX, ev.clientY);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            });
            pieceEl.addEventListener('touchstart', (e) => {
                if (!gameActive) return;
                e.preventDefault();
                const t = e.touches[0];
                const shapeCopy = shapeObj.s.map(row => row.slice());
                const fixedMolePos = normalizeMolePos(shapeCopy, molePos);
                const data = {shape: shapeCopy, molePos: fixedMolePos, moleType};
                const rect = pieceEl.getBoundingClientRect();
                const cellW = rect.width / shapeW;
                const cellH = rect.height / shapeH;
                const ox = t.clientX - rect.left;
                const oy = t.clientY - rect.top;
                const offsetC = Math.max(0, Math.min(shapeW - 1, Math.floor(ox / cellW)));
                const offsetR = Math.max(0, Math.min(shapeH - 1, Math.floor(oy / cellH)));
                touchDrag = { data, offsetR, offsetC, sourceEl: pieceEl, lift: 80 };
                pieceEl.style.opacity = '0.35';
                pieceEl.style.filter = 'grayscale(0.2) brightness(1.1)';
                pieceEl.style.transform = 'translateY(-80px)';
                createDragGhost(shapeCopy, fixedMolePos);
                moveDragGhost(t.clientX, t.clientY);
                updatePreviewFromPointer(t.clientX, t.clientY);
            }, { passive: false });
            pieceEl.addEventListener('touchmove', (e) => {
                if (!touchDrag) return;
                e.preventDefault();
                const t = e.touches[0];
                moveDragGhost(t.clientX, t.clientY);
                updatePreviewFromPointer(t.clientX, t.clientY);
            }, { passive: false });
            pieceEl.addEventListener('touchend', (e) => {
                if (!touchDrag) return;
                e.preventDefault();
                const t = e.changedTouches[0];
                finalizeTouchDrop(t.clientX, t.clientY);
            });
            pieceEl.addEventListener('touchcancel', () => {
                if (!touchDrag) return;
                resetTouchDrag();
            });

            slot.appendChild(pieceEl);
            piecesContainer.appendChild(slot);
        }
    }

    let dragInfo = null;
    let touchDrag = null;
    let dragGhost = null;

    gridEl.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragInfo) return;
        const data = dragInfo.data;
        const rect = gridEl.getBoundingClientRect();
        const cellSize = rect.width / GRID_SIZE;
        const targetR = Math.floor((e.clientY - rect.top) / cellSize) - dragInfo.offsetR;
        const targetC = Math.floor((e.clientX - rect.left) / cellSize) - dragInfo.offsetC;
        const snap = getSnapPlacement(data.shape, targetR, targetC);
        updatePreview(data.shape, snap.r, snap.c);
    });
    gridEl.addEventListener('drop', e => {
        e.preventDefault();
        if (!dragInfo) return;
        const data = dragInfo.data;
        const rect = gridEl.getBoundingClientRect();
        const cellSize = rect.width / GRID_SIZE;
        const targetR = Math.floor((e.clientY - rect.top) / cellSize) - dragInfo.offsetR;
        const targetC = Math.floor((e.clientX - rect.left) / cellSize) - dragInfo.offsetC;
        const snap = getSnapPlacement(data.shape, targetR, targetC);
        const ok = canPlace(data.shape, snap.r, snap.c);
        if (ok) {
            placeBlock(data.shape, snap.r, snap.c, data.molePos, data.moleType);
            if (dragInfo.sourceEl && dragInfo.sourceEl.parentElement) {
                dragInfo.sourceEl.parentElement.innerHTML = '';
            }

            if (isAllSlotsEmpty()) generatePieces();

            setTimeout(() => {
                checkClearance();
                setTimeout(moveMoles, 360);
            }, 50);
            setTimeout(() => {
                if (!hasAnyMoves()) endGame(false, '没有空格了');
            }, 520);
        } else {
            boardShake();
        }
        clearPreview();
        dragInfo = null;
    });

    function canPlace(shape, r, c) {
        for (let i = 0; i < shape.length; i++) {
            for (let j = 0; j < shape[i].length; j++) {
                if (shape[i][j]) {
                    let nr = r + i, nc = c + j;
                    if (nr < 0 || nc < 0 || nr >= GRID_SIZE || nc >= GRID_SIZE || grid[nr][nc]) return false;
                }
            }
        }
        return true;
    }

    function placeBlock(shape, r, c, molePos, moleType) {
        const fixedMolePos = normalizeMolePos(shape, molePos);
        const hasMole = Boolean(fixedMolePos);
        const blockId = blockIdCounter++;
        shape.forEach((row, i) => {
            row.forEach((v, j) => {
                if (v) {
                    grid[r + i][c + j] = 1;
                    if (hasMole) {
                        holes[r + i][c + j] = 1;
                        holeBlockId[r + i][c + j] = blockId;
                        holeVisits[r + i][c + j] = 0;
                    }
                    if (hasMole && i === fixedMolePos.r && j === fixedMolePos.c) {
                        createMoleEntity(r + i, c + j, moleType, blockId);
                    }
                }
            });
        });
        updateGridView(true);
    }

    function createMoleEntity(r, c, moleType, blockId) {
        const el = document.createElement('div');
        el.className = 'mole-entity';
        const sprite = document.createElement('img');
        sprite.className = 'mole-sprite';
        sprite.src = 'mole.png';
        sprite.alt = 'mole';
        el.appendChild(sprite);
        const emoji = document.createElement('div');
        emoji.className = 'mole-emoji';
        emoji.innerText = '💦';
        el.appendChild(emoji);
        moleLayer.appendChild(el);
        const reward = rewardPerMole;
        const moleObj = { id: moleIdCounter++, r, c, element: el, freezeTurns: 1, reward, moleType, blockId };
        moles.push(moleObj);
        positionMoleElement(moleObj);
    }

    function positionMoleElement(mole) {
        const x = mole.c * 100;
        const y = mole.r * 100;
        mole.element.style.setProperty('--mx', `${x}%`);
        mole.element.style.setProperty('--my', `${y}%`);
    }

    function moveMoles() {
        moles.forEach(mole => {
            if (mole.freezeTurns > 0) {
                mole.freezeTurns--;
                positionMoleElement(mole);
                return;
            }
            const neighbors = [
                { dr: 0, dc: 1 },  // right
                { dr: 1, dc: 0 },  // down
                { dr: 0, dc: -1 }, // left
                { dr: -1, dc: 0 }  // up
            ];

            let candidates = [];
            neighbors.forEach((d, idx) => {
                const nr = mole.r + d.dr;
                const nc = mole.c + d.dc;
                if (nr < 0 || nc < 0 || nr >= GRID_SIZE || nc >= GRID_SIZE) return;
                if (!holes[nr][nc]) return;
                if (holeBlockId[nr][nc] !== mole.blockId) return;
                candidates.push({
                    r: nr,
                    c: nc,
                    visits: holeVisits[nr][nc],
                    order: idx
                });
            });

            if (candidates.length > 0) {
                candidates.sort((a, b) => (a.visits - b.visits) || (a.order - b.order));
                const next = candidates[0];
                mole.r = next.r;
                mole.c = next.c;
                holeVisits[mole.r][mole.c] += 1;
            }
            positionMoleElement(mole);
        });
        collapseIsolatedHoles();
        updateGridView();
    }

    function checkClearance() {
        let fullRows = [];
        let fullCols = [];

        for (let i = 0; i < GRID_SIZE; i++) {
            if (grid[i].every(v => v === 1)) fullRows.push(i);
            if (grid.every(row => row[i] === 1)) fullCols.push(i);
        }

        if (fullRows.length === 0 && fullCols.length === 0) return;

        const captured = moles.filter(mole => fullRows.includes(mole.r) || fullCols.includes(mole.c));

        animateClearance(fullRows, fullCols);

        setTimeout(() => {
            fullRows.forEach(r => {
                grid[r].fill(0);
                holes[r].fill(0);
                holeVisits[r].fill(0);
                holeBlockId[r].fill(-1);
            });
            fullCols.forEach(c => {
                grid.forEach(row => row[c] = 0);
                holes.forEach(row => row[c] = 0);
                holeVisits.forEach(row => row[c] = 0);
                holeBlockId.forEach(row => row[c] = -1);
            });
            updateGridView();
        }, 360);

        captured.forEach((mole, idx) => {
            const delay = 260 + idx * 80;
            setTimeout(() => spawnHammerSequence(mole), delay);
        });

        moles = moles.filter(mole => !captured.includes(mole));
    }

    function animateClearance(fullRows, fullCols) {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (fullRows.includes(r) || fullCols.includes(c)) {
                    const cell = document.getElementById(`grid-${r}-${c}`);
                    cell.classList.add('crack');
                    setTimeout(() => {
                        cell.classList.remove('crack');
                        cell.classList.add('shatter');
                    }, 160);
                    setTimeout(() => cell.classList.remove('shatter'), 360);
                }
            }
        }
    }

    function updatePreview(shape, r, c) {
        clearPreview();
        let invalid = false;
        const occupied = [];
        for (let i = 0; i < shape.length; i++) {
            for (let j = 0; j < shape[i].length; j++) {
                if (!shape[i][j]) continue;
                const nr = r + i;
                const nc = c + j;
                if (nr < 0 || nc < 0 || nr >= GRID_SIZE || nc >= GRID_SIZE || grid[nr][nc]) {
                    invalid = true;
                } else {
                    previewCells.push({ r: nr, c: nc });
                    occupied.push({ r: nr, c: nc });
                }
            }
        }
        const predicted = predictClearance(occupied);
        previewCells.forEach(p => {
            const cell = document.getElementById(`grid-${p.r}-${p.c}`);
            cell.classList.add('preview');
            if (invalid) cell.classList.add('invalid');
            if (predicted.hit) cell.classList.add('hit');
        });
        predicted.lineCells.forEach(p => {
            const cell = document.getElementById(`grid-${p.r}-${p.c}`);
            cell.classList.add('line-preview');
            previewLines.push(p);
        });
    }

    function clearPreview() {
        previewCells.forEach(p => {
            const cell = document.getElementById(`grid-${p.r}-${p.c}`);
            cell.classList.remove('preview', 'invalid', 'hit');
        });
        previewLines.forEach(p => {
            const cell = document.getElementById(`grid-${p.r}-${p.c}`);
            cell.classList.remove('line-preview');
        });
        previewCells = [];
        previewLines = [];
    }

    function boardShake() {
        const board = document.getElementById('board-wrapper');
        board.classList.remove('board-shake');
        board.offsetWidth;
        board.classList.add('board-shake');
    }

    function updatePreviewFromPointer(x, y) {
        if (!touchDrag) return;
        const { targetR, targetC } = getPlacementFromPointer(x, y);
        const snap = getSnapPlacement(touchDrag.data.shape, targetR, targetC);
        updatePreview(touchDrag.data.shape, snap.r, snap.c);
    }

    function finalizeTouchDrop(x, y) {
        if (!touchDrag) return;
        const { targetR, targetC } = getPlacementFromPointer(x, y);
        const snap = getSnapPlacement(touchDrag.data.shape, targetR, targetC);
        const ok = canPlace(touchDrag.data.shape, snap.r, snap.c);
        if (ok) {
            placeBlock(touchDrag.data.shape, snap.r, snap.c, touchDrag.data.molePos, touchDrag.data.moleType);
            if (touchDrag.sourceEl && touchDrag.sourceEl.parentElement) {
                touchDrag.sourceEl.parentElement.innerHTML = '';
            }
            if (isAllSlotsEmpty()) generatePieces();
            setTimeout(() => {
                checkClearance();
                setTimeout(moveMoles, 360);
            }, 50);
            setTimeout(() => {
                if (!hasAnyMoves()) endGame(false, '没有空格了');
            }, 520);
        } else {
            boardShake();
        }
        clearPreview();
        resetTouchDrag();
    }

    function resetTouchDrag() {
        if (!touchDrag) return;
        const el = touchDrag.sourceEl;
        if (el) {
            el.style.opacity = '1';
            el.style.filter = 'none';
            el.style.transform = '';
        }
        removeDragGhost();
        touchDrag = null;
    }

    function createDragGhost(shape, molePos) {
        removeDragGhost();
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.style.gridTemplateColumns = `repeat(${shape[0].length}, 1fr)`;
        shape.forEach((row, r) => {
            row.forEach((v, c) => {
                const cEl = document.createElement('div');
                cEl.className = v ? 'p-cell' : 'p-cell empty';
                if (v && molePos && r === molePos.r && c === molePos.c) {
                    cEl.classList.add('has-mole');
                }
                ghost.appendChild(cEl);
            });
        });
        document.body.appendChild(ghost);
        dragGhost = ghost;
    }

    function moveDragGhost(x, y) {
        if (!dragGhost) return;
        const { left, top } = getGhostTopLeft(x, y);
        dragGhost.style.left = `${left}px`;
        dragGhost.style.top = `${top}px`;
    }

    function removeDragGhost() {
        if (dragGhost && dragGhost.parentElement) {
            dragGhost.parentElement.removeChild(dragGhost);
        }
        dragGhost = null;
    }

    function getGhostTopLeft(x, y) {
        const rect = gridEl.getBoundingClientRect();
        const cellSize = rect.width / GRID_SIZE;
        const left = x - (touchDrag.offsetC + 0.5) * cellSize;
        const top = y - (touchDrag.offsetR + 0.5) * cellSize - (touchDrag.lift || 0);
        return { left, top, cellSize, gridTop: rect.top, gridLeft: rect.left };
    }

    function getPlacementFromPointer(x, y) {
        const { left, top, cellSize, gridTop, gridLeft } = getGhostTopLeft(x, y);
        const targetR = Math.floor((top - gridTop) / cellSize);
        const targetC = Math.floor((left - gridLeft) / cellSize);
        return { targetR, targetC };
    }

    function hasAnyMoves() {
        const shapes = Array.from(piecesContainer.querySelectorAll('.piece'))
            .map(piece => JSON.parse(piece.getAttribute('data-shape') || 'null'))
            .filter(Boolean);
        if (shapes.length === 0) return false;
        for (const shape of shapes) {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (canPlace(shape, r, c)) return true;
                }
            }
        }
        return false;
    }

    function screenShake() {
        const shell = document.querySelector('.device-shell');
        if (!shell) return;
        shell.classList.remove('screen-shake');
        shell.offsetWidth;
        shell.classList.add('screen-shake');
    }

    function getSnapPlacement(shape, r, c) {
        if (canPlace(shape, r, c)) return { r, c };
        return findNearestPlacement(shape, r, c, 2);
    }

    function findNearestPlacement(shape, r, c, radius) {
        let best = null;
        let bestDist = Infinity;
        for (let dr = -radius; dr <= radius; dr++) {
            for (let dc = -radius; dc <= radius; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (!canPlace(shape, nr, nc)) continue;
                const dist = Math.abs(dr) + Math.abs(dc);
                if (dist < bestDist) {
                    bestDist = dist;
                    best = { r: nr, c: nc };
                }
            }
        }
        return best || { r, c };
    }

    function predictClearance(occupied) {
        const temp = grid.map(row => row.slice());
        occupied.forEach(p => {
            temp[p.r][p.c] = 1;
        });
        const fullRows = [];
        const fullCols = [];
        for (let i = 0; i < GRID_SIZE; i++) {
            if (temp[i].every(v => v === 1)) fullRows.push(i);
            if (temp.every(row => row[i] === 1)) fullCols.push(i);
        }
        const lineCells = [];
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (fullRows.includes(r) || fullCols.includes(c)) {
                    lineCells.push({ r, c });
                }
            }
        }
        const hit = moles.some(m => fullRows.includes(m.r) || fullCols.includes(m.c));
        return { lineCells, hit };
    }

    function spawnHammerSequence(mole) {
        const h = document.createElement('div');
        h.className = 'hammer';
        h.style.left = (mole.c * 12.5) + '%';
        h.style.top = (mole.r * 12.5) + '%';
        moleLayer.appendChild(h);

        const egg = document.createElement('div');
        egg.className = 'egg';
        egg.innerText = '🥚';
        egg.style.left = (mole.c * 12.5) + '%';
        egg.style.top = (mole.r * 12.5) + '%';
        moleLayer.appendChild(egg);

        setTimeout(() => {
            h.classList.add('smash');
        }, 300);

        setTimeout(() => {
            mole.element.classList.add('stunned');
            screenShake();
        }, 260);

        setTimeout(() => {
            egg.classList.add('shatter');
        }, 320);

        setTimeout(() => {
            flyMoneyToEarned(mole.r, mole.c, mole.reward);
        }, 420);

        setTimeout(() => {
            egg.remove();
            mole.element.remove();
            h.remove();
            collectedCount++;
            updateTopStats();
            if (!passedGoal && collectedCount >= GOAL_TARGET) {
                passedGoal = true;
                showToast('Goal达成，可继续冲刺最大奖励', 1400);
            }
            if (getEarnedAmount() >= maxReward || collectedCount >= maxKillsCurrent) {
                endGame(true, '已拿满最大奖励', { type: 'max_win' });
            }
        }, 780);
    }

    function updateGridView(pulse = false) {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.getElementById(`grid-${r}-${c}`);
                let classes = grid[r][c] ? 'cell filled' : 'cell';
                if (holes[r][c]) {
                    classes += ' has-hole';
                    cell.style.setProperty('--hole-img', "url('hole3.jpg')");
                } else {
                    cell.style.removeProperty('--hole-img');
                }
                cell.className = classes;
                if (pulse && grid[r][c]) {
                    cell.classList.add('pulse');
                    setTimeout(() => cell.classList.remove('pulse'), 420);
                }
            }
        }
        updateReachableOverlay();
    }

    function updateReachableOverlay() {
        const reachable = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        const queue = [];
        moles.forEach(m => {
            reachable[m.r][m.c] = true;
            queue.push({ r: m.r, c: m.c, blockId: m.blockId });
        });

        while (queue.length) {
            const cur = queue.shift();
            const neighbors = [[0,1], [0,-1], [1,0], [-1,0]];
            neighbors.forEach(d => {
                const nr = cur.r + d[0];
                const nc = cur.c + d[1];
                if (nr < 0 || nc < 0 || nr >= GRID_SIZE || nc >= GRID_SIZE) return;
                if (!holes[nr][nc] || reachable[nr][nc]) return;
                if (holeBlockId[nr][nc] !== cur.blockId) return;
                reachable[nr][nc] = true;
                queue.push({ r: nr, c: nc, blockId: cur.blockId });
            });
        }

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.getElementById(`grid-${r}-${c}`);
                cell.classList.toggle('reachable', reachable[r][c]);
            }
        }

        moles.forEach(m => {
            let count = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (reachable[r][c] && holeBlockId[r][c] === m.blockId) count++;
                }
            }
            if (count <= 1) {
                m.element.classList.add('scared');
            } else {
                m.element.classList.remove('scared');
            }
        });
    }

    function collapseIsolatedHoles() {
        const reachable = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
        const queue = [];
        moles.forEach(m => {
            reachable[m.r][m.c] = true;
            queue.push({ r: m.r, c: m.c, blockId: m.blockId });
        });

        while (queue.length) {
            const cur = queue.shift();
            const neighbors = [[0,1], [0,-1], [1,0], [-1,0]];
            neighbors.forEach(d => {
                const nr = cur.r + d[0];
                const nc = cur.c + d[1];
                if (nr < 0 || nc < 0 || nr >= GRID_SIZE || nc >= GRID_SIZE) return;
                if (!holes[nr][nc] || reachable[nr][nc]) return;
                if (holeBlockId[nr][nc] !== cur.blockId) return;
                reachable[nr][nc] = true;
                queue.push({ r: nr, c: nc, blockId: cur.blockId });
            });
        }

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (holes[r][c] && !reachable[r][c]) {
                    holes[r][c] = 0;
                    holeVisits[r][c] = 0;
                    holeBlockId[r][c] = -1;
                }
            }
        }
    }

    function flyMoneyToEarned(r, c, reward) {
        const boardRect = moleLayer.getBoundingClientRect();
        const cellSize = boardRect.width / GRID_SIZE;
        const startX = boardRect.left + (c + 0.5) * cellSize;
        const startY = boardRect.top + (r + 0.5) * cellSize;

        const targetRect = earnedStatusEl.getBoundingClientRect();
        const targetX = targetRect.left + targetRect.width / 2;
        const targetY = targetRect.top + targetRect.height / 2;

        const flyer = document.createElement('div');
        flyer.className = 'money-flyer';
        flyer.innerText = `💵 +$${reward.toFixed(2)}`;
        flyer.style.left = `${startX}px`;
        flyer.style.top = `${startY}px`;
        document.body.appendChild(flyer);
        const duration = 900;
        const startTime = performance.now();

        function tick(now) {
            const t = Math.min(1, (now - startTime) / duration);
            const ease = 1 - Math.pow(1 - t, 3);
            const x = startX + (targetX - startX) * ease;
            const y = startY + (targetY - startY) * ease;
            const scale = 1 - 0.18 * ease;
            flyer.style.left = `${x}px`;
            flyer.style.top = `${y}px`;
            flyer.style.transform = `translate(-50%, -50%) scale(${scale})`;
            flyer.style.opacity = `${1 - ease}`;
            if (t < 1) {
                requestAnimationFrame(tick);
            } else {
                flyer.remove();
            }
        }

        requestAnimationFrame(tick);
    }

    function getEarnedAmount() {
        return Math.min(collectedCount * rewardPerMole, maxReward);
    }

    function updateBalanceView() {
        balanceEl.innerText = `$${accountBalance.toFixed(2)}`;
    }

    function showToast(message, delay = 1200) {
        toastEl.innerText = message;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), delay);
    }

    function openRechargeModal() {
        rechargeModalEl.classList.remove('hidden');
    }

    function closeRechargeModal() {
        rechargeModalEl.classList.add('hidden');
    }

    function updateTopStats() {
        const total = getEarnedAmount();
        const maxText = Number.isFinite(maxReward) ? `$${maxReward.toFixed(2)}` : '∞';
        earnedStatusEl.innerText = `$${total.toFixed(2)}/${maxText}`;
        if (collectedCount >= GOAL_TARGET) {
            goalStatusEl.innerText = '✅';
        } else {
            goalStatusEl.innerText = `${collectedCount}/${GOAL_TARGET}`;
        }
    }

    function normalizeMolePos(shape, molePos) {
        if (!molePos) return null;
        if (shape[molePos.r] && shape[molePos.r][molePos.c]) return molePos;
        const valid = [];
        shape.forEach((row, r) => row.forEach((v, c) => v && valid.push({ r, c })));
        return valid.length ? valid[0] : null;
    }

    function isAllSlotsEmpty() {
        return Array.from(piecesContainer.children).every(slot => slot.innerHTML === '');
    }

    function drawAutoReturnMultiplier() {
        const roll = Math.random();
        let acc = 0;
        for (const option of DEBUG_RETURN_OPTIONS) {
            acc += option.chance;
            if (roll <= acc) return option.value;
        }
        return DEBUG_RETURN_OPTIONS[DEBUG_RETURN_OPTIONS.length - 1].value;
    }

    function updateIngameDebugView() {
        const label = Number.isFinite(activeReturnMultiplier) ? `${activeReturnMultiplier}x` : 'INF';
        const mode = debugUnlimitedMode ? 'Unlimited' : 'Normal';
        const seedText = runSeed === null ? '--' : runSeed;
        const moleRate = `${Math.round(getCurrentMoleSpawnRate() * 100)}%`;
        ingameDebugMultiEl.innerText = `Mode: ${mode} | Return: ${label} | Mole: ${moleRate} | Seed: ${seedText}`;
    }

    function recalcRewards() {
        goalReward = entryFee * 1.5;
        maxReward = debugUnlimitedMode ? Infinity : (entryFee * activeReturnMultiplier);
        rewardPerMole = goalReward / GOAL_TARGET;
        maxKillsCurrent = debugUnlimitedMode ? Infinity : Math.max(MAX_KILLS, Math.ceil(maxReward / rewardPerMole));
    }

    function updateGateSummary() {
        gateGoalMolesEl.innerText = `${GOAL_TARGET}`;
        gateMaxEl.innerText = Number.isFinite(maxReward) ? `$${maxReward.toFixed(2)}` : '∞';
        playEntryBtn.innerText = `Play for $${entryFee}`;
        const autoText = selectedDebugMultiplier === null
            ? '未选择时自动按概率: 40% / 50% / 10%（当前将自动抽取）'
            : `已固定返奖倍率: ${selectedDebugMultiplier}x`;
        debugHintEl.innerText = autoText;
        debugUnlimitedBtn.classList.toggle('active', debugUnlimitedMode);
        debugUnlimitedBtn.innerText = `Unlimited Mode: ${debugUnlimitedMode ? 'ON' : 'OFF'}`;
    }

    function applyStake(multiplier) {
        selectedStake = multiplier;
        entryFee = multiplier;
        activeReturnMultiplier = selectedDebugMultiplier ?? 2;
        recalcRewards();
        updateGateSummary();
        stakeBtns.forEach((btn) => {
            btn.classList.toggle('active', Number(btn.dataset.stake) === selectedStake);
        });
        updateTopStats();
    }

    function resetRuntimeState() {
        moles.forEach((mole) => mole.element.remove());
        moles = [];
        grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        holes = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        holeBlockId = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(-1));
        holeVisits = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        collectedCount = 0;
        passedGoal = false;
        blockIdCounter = 0;
        blockSequenceCursor = 0;
        timeLeft = 180;
        timerEl.innerText = debugUnlimitedMode ? '∞' : '03:00';
        piecesContainer.innerHTML = '';
        initGrid();
        applyInitialGrid();
        updateTopStats();
        updateIngameDebugView();
    }

    function returnToLevelGate(nextLevel = false) {
        if (nextLevel) {
            levelNumber += 1;
            levelTitleEl.innerText = `Level ${levelNumber}`;
        }
        document.getElementById('overlay').classList.add('hidden');
        msgSubtitleEl.innerText = '';
        overlayBtnEl.onclick = null;
        gameActive = false;
        levelGateEl.classList.remove('hidden');
        debugToggleBtn.classList.remove('hidden');
        resetRuntimeState();
    }

    function openSettlement(title, subtitle, buttonText, onClick) {
        document.getElementById('msg-title').innerText = title;
        msgSubtitleEl.innerText = subtitle;
        document.getElementById('msg-title').style.color = '#1f1f1f';
        overlayBtnEl.innerText = buttonText;
        overlayBtnEl.onclick = onClick;
        document.getElementById('overlay').classList.remove('hidden');
    }

    function startGameFromGate() {
        if (accountBalance < entryFee) {
            showToast('余额不足，无法下注', 1400);
            openRechargeModal();
            return;
        }
        accountBalance -= entryFee;
        updateBalanceView();
        activeReturnMultiplier = selectedDebugMultiplier ?? drawAutoReturnMultiplier();
        if (debugUnlimitedMode) {
            startRandomRunSeed();
        } else {
            runSeed = null;
            runRandom = Math.random;
        }
        recalcRewards();
        updateGateSummary();
        resetRuntimeState();
        gameActive = true;
        generatePieces();
        levelGateEl.classList.add('hidden');
        debugDrawerEl.classList.add('hidden');
        debugToggleBtn.classList.add('hidden');
        closeRechargeModal();
    }

    stakeBtns.forEach((btn) => {
        btn.addEventListener('click', () => applyStake(Number(btn.dataset.stake)));
    });
    debugMultiBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
            const val = Number(btn.dataset.multi);
            selectedDebugMultiplier = (selectedDebugMultiplier === val) ? null : val;
            debugMultiBtns.forEach((it) => it.classList.toggle('active', Number(it.dataset.multi) === selectedDebugMultiplier));
            activeReturnMultiplier = selectedDebugMultiplier ?? 2;
            recalcRewards();
            updateGateSummary();
            updateTopStats();
        });
    });
    debugUnlimitedBtn.addEventListener('click', () => {
        debugUnlimitedMode = !debugUnlimitedMode;
        recalcRewards();
        updateGateSummary();
        updateTopStats();
        updateIngameDebugView();
    });
    debugToggleBtn.addEventListener('click', () => {
        if (gameActive) return;
        debugDrawerEl.classList.toggle('hidden');
    });
    balancePlusBtn.addEventListener('click', openRechargeModal);
    rechargeCloseBtn.addEventListener('click', closeRechargeModal);
    rechargePackBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
            const amount = Number(btn.dataset.amount) || 0;
            accountBalance += amount;
            updateBalanceView();
            showToast(`充值成功 +$${amount.toFixed(2)}`, 1000);
            closeRechargeModal();
        });
    });
    playEntryBtn.addEventListener('click', startGameFromGate);

    const timerInterval = setInterval(() => {
        if (!gameActive) return;
        if (debugUnlimitedMode) {
            timerEl.innerText = '∞';
            return;
        }
        timeLeft--;
        const m = Math.floor(timeLeft/60).toString().padStart(2, '0');
        const s = (timeLeft%60).toString().padStart(2, '0');
        timerEl.innerText = `${m}:${s}`;
        if (timeLeft <= 0) endGame(false, '时间到');
    }, 1000);

    function endGame(win, message, meta = {}) {
        gameActive = false;
        const earned = getEarnedAmount();
        const reachedGoal = collectedCount >= GOAL_TARGET;
        const reachedMax = earned >= maxReward || meta.type === 'max_win';

        if (reachedMax) {
            accountBalance += earned;
            updateBalanceView();
            openSettlement(
                'Victory',
                `你获得了 $${earned.toFixed(2)}，余额 $${accountBalance.toFixed(2)}`,
                '下一关',
                () => returnToLevelGate(true)
            );
            return;
        }

        if (!reachedGoal) {
            showToast('挑战失败', 900);
            setTimeout(() => {
                openSettlement(
                    '未达成Goal',
                    '本局没有获得钱',
                    accountBalance <= 0 ? '去充值' : '返回关卡',
                    () => returnToLevelGate(false)
                );
                if (accountBalance <= 0) openRechargeModal();
            }, 950);
            return;
        }

        accountBalance += earned;
        updateBalanceView();
        openSettlement(
            'Victory',
            `过关奖励 $${earned.toFixed(2)}，余额 $${accountBalance.toFixed(2)}`,
            '下一关',
            () => returnToLevelGate(true)
        );
    }

    applyStake(1);
    resetRuntimeState();
    updateBalanceView();
</script>

</body>
